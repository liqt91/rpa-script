[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["src/runtime/tests", "src/mcp_server/tests"]
addopts = "--ignore=src/runtime/tests/test_client.py"

[tool.ruff]
line-length = 120
exclude = [
    "src/service/local_jobs/_generated",
    "src/service/local_jobs/test",
    "src/service/jobs",
]
ignore = ["F403", "E402"]

[tool.ruff.per-file-ignores]

"src/runtime/workflow/commands.py" = ["E501"]
"src/shared/extraction_engine.py" = ["E501"]
# 指令实现文件（extension/backend/desktop/control*_commands/*.py）：Param 定义
# 与 PowerShell/JSON 字符串常为单行长行，属生成+手写业务代码，豁免行长度。
"src/runtime/commands/*_commands/*.py" = ["E501"]
